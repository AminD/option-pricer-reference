[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricer"
version = "1.0.0"
description = "Option pricing with Black-Scholes, Monte Carlo, binomial trees and finite differences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "pandas>=2.0"]
dev = ["pytest>=8.0", "ipykernel>=6.0"]

[project.scripts]
option-pricer = "pricer.cli:main"

[tool.setuptools]
packages = ["pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
